<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PackSignal · Live AR Review</title>
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/ar-review.css">
</head>
<body class="ar-review-body ar-sample-mode">
  <video class="ar-camera-viewport" id="ar-camera-feed" autoplay playsinline muted></video>
  <div class="ar-ambient" aria-hidden="true"></div>
  <header class="ar-hud-header">
    <div class="ar-hud-pill"><i class="ar-status-dot pulsing" id="ar-status-dot"></i><span id="ar-tracking-label">AR: DANCING FISH LAYER READY</span></div>
    <div class="ar-header-actions"><button type="button" class="ar-hud-btn" id="switch-camera-btn">↻ Camera</button><button type="button" class="ar-hud-btn ar-hud-btn-highlight" id="toggle-sample-feed-btn">✦ Demo carton</button></div>
  </header>
  <div class="ar-toast-banner" id="ar-toast">Move closer to the Dancing Fish carton</div>
  <div class="ar-perf-pill" id="ar-perf-pill">LIVE · spatial review</div>
  <main class="ar-stage" aria-label="Augmented reality package review">
    <div class="ar-stage-grid" aria-hidden="true"></div><div class="ar-carton-shadow" aria-hidden="true"></div>
    <div class="ar-carton" id="ar-reticle-guide"><div class="ar-carton-top" aria-hidden="true"></div><div class="ar-carton-side" aria-hidden="true"><img src="/samples/organizer/panels/right.png" alt=""><span>DANCING FISH</span></div><div class="ar-carton-face"><img id="ar-simulated-feed" src="/samples/organizer/panels/front-ar.png" alt="Dancing Fish Berry Crunch carton"><div class="ar-annotation-layer" id="ar-annotation-layer" aria-live="polite"></div></div><div class="ar-carton-edge" aria-hidden="true"></div></div>
    <span class="sr-only" id="ar-face-guide-text">Front PDP anchor</span>
  </main>
  <div class="ar-manual-align-overlay" id="ar-manual-align-overlay" aria-label="Manual carton alignment"><div class="ar-corner-handle" id="handle-tl"></div><div class="ar-corner-handle" id="handle-tr"></div><div class="ar-corner-handle" id="handle-bl"></div><div class="ar-corner-handle" id="handle-br"></div></div>
  <footer class="ar-bottom-dock">
    <div class="ar-readiness-card"><div class="ar-score"><b>72</b><span>%</span></div><div><b>Artwork readiness</b><small>2 issues · 1 needs evidence · 5 passed</small></div><button type="button" id="open-findings-btn">View findings</button></div>
    <div class="ar-face-switcher" id="ar-face-switcher"><button type="button" class="ar-face-btn active" data-face="front">Front</button><button type="button" class="ar-face-btn" data-face="right">Nutrition</button><button type="button" class="ar-face-btn" data-face="back">Back</button><button type="button" class="ar-face-btn" data-face="left">Side</button></div>
    <div class="ar-actions"><button type="button" class="ar-action-btn ar-btn-red" id="toggle-redpen-btn">✦ Hide marks</button><button type="button" class="ar-action-btn" id="manual-align-btn">⌘ Align</button><button type="button" class="ar-action-btn" id="fallback-2d-btn">Open review</button><button type="button" class="ar-action-btn ar-secondary-action" id="market-toggle-btn">US FDA</button><button type="button" class="ar-action-btn ar-secondary-action" id="snap-competitor-btn">Compare</button></div>
  </footer>
  <section class="ar-finding-drawer" id="ar-finding-drawer" aria-label="Finding details"><div class="ar-drawer-header"><div><span class="ar-badge-issue" id="drawer-finding-status">ISSUE</span><b id="drawer-finding-title">Finding</b></div><button type="button" id="close-drawer-btn">×</button></div><div id="drawer-panel-name"></div><div class="ar-evidence-box"><div><b>Observed:</b> <span id="drawer-observed-text"></span></div><div><b>Required:</b> <span id="drawer-expected-text"></span></div><div><b>Rule:</b> <code id="drawer-rule-id"></code></div><div><b>Evidence:</b> <span id="drawer-source-ref"></span></div><div><b>Owner:</b> <span id="drawer-department"></span></div></div><div class="ar-drawer-actions"><button type="button" id="drawer-view-artwork-btn">View artwork</button><button type="button" id="drawer-close-btn">Back to AR</button></div></section>
  <div id="competitor-modal" class="ar-modal"><div><header><b>Compare a competitor pack</b><button type="button" id="close-competitor-modal-btn">×</button></header><div id="competitor-modal-content"></div></div></div>
  <script type="module" src="/ar-review.js"></script>
</body>
</html>
